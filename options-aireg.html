<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI Regulation — Logo & Banner Options</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: system-ui,sans-serif; background:#0b0614; color:#f5f0ff; }
  header { padding:24px 20px 8px; max-width:1100px; margin:0 auto; }
  h1 { margin:0 0 6px; font-size:1.4rem; }
  p { margin:0 0 18px; opacity:.75; }
  section { max-width:1100px; margin:0 auto 28px; padding:0 20px; }
  h2 { font-size:1.05rem; margin:0 0 12px; color:#ff4db8; }
  .grid { display:grid; gap:14px; grid-template-columns: repeat(auto-fill,minmax(160px,1fr)); }
  .grid.banners { grid-template-columns: 1fr; }
  figure { margin:0; background:#160b28; border:1px solid #3a2158; border-radius:12px; overflow:hidden; }
  figcaption { padding:8px 10px 10px; font-size:.85rem; }
  a { color:#ff9ad4; }
  img.logo { width:100%; aspect-ratio:1; object-fit:cover; background:#000; display:block; image-rendering:auto; }
  img.banner { width:100%; height:auto; display:block; background:#000; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  code { background:#221033; padding:2px 6px; border-radius:6px; font-size:.8rem; }
</style>
</head>
<body>
<header>
  <h1>AI Regulation — pick options</h1>
  <p>5 logos (128×128 Discord marks) + 5 banners. Open the PNG direct links for Discord upload.</p>
  <p><a href="index.html">← Hub</a></p>
</header>
<section>
  <h2>Logos (128×128)</h2>
  <div class="grid">
    <figure><img class="logo" src="assets/options/aireg/aireg-logo-01-128.png" alt="Logo 1"/><figcaption>Logo 1 · <a href="assets/options/aireg/aireg-logo-01-128.png">PNG</a> · <a href="assets/options/aireg/aireg-logo-01.png">hi-res</a></figcaption></figure>
    <figure><img class="logo" src="assets/options/aireg/aireg-logo-02-128.png" alt="Logo 2"/><figcaption>Logo 2 · <a href="assets/options/aireg/aireg-logo-02-128.png">PNG</a> · <a href="assets/options/aireg/aireg-logo-02.png">hi-res</a></figcaption></figure>
    <figure><img class="logo" src="assets/options/aireg/aireg-logo-03-128.png" alt="Logo 3"/><figcaption>Logo 3 · <a href="assets/options/aireg/aireg-logo-03-128.png">PNG</a> · <a href="assets/options/aireg/aireg-logo-03.png">hi-res</a></figcaption></figure>
    <figure><img class="logo" src="assets/options/aireg/aireg-logo-04-128.png" alt="Logo 4"/><figcaption>Logo 4 · <a href="assets/options/aireg/aireg-logo-04-128.png">PNG</a> · <a href="assets/options/aireg/aireg-logo-04.png">hi-res</a></figcaption></figure>
    <figure><img class="logo" src="assets/options/aireg/aireg-logo-05-128.png" alt="Logo 5"/><figcaption>Logo 5 · <a href="assets/options/aireg/aireg-logo-05-128.png">PNG</a> · <a href="assets/options/aireg/aireg-logo-05.png">hi-res</a></figcaption></figure>
  </div>
</section>
<section>
  <h2>Banners</h2>
  <div class="grid banners">
    <figure><img class="banner" src="assets/options/aireg/aireg-banner-01.png" alt="Banner 1"/><figcaption>Banner 1 · <a href="assets/options/aireg/aireg-banner-01.png">PNG</a></figcaption></figure>
    <figure><img class="banner" src="assets/options/aireg/aireg-banner-02.png" alt="Banner 2"/><figcaption>Banner 2 · <a href="assets/options/aireg/aireg-banner-02.png">PNG</a></figcaption></figure>
    <figure><img class="banner" src="assets/options/aireg/aireg-banner-03.png" alt="Banner 3"/><figcaption>Banner 3 · <a href="assets/options/aireg/aireg-banner-03.png">PNG</a></figcaption></figure>
    <figure><img class="banner" src="assets/options/aireg/aireg-banner-04.png" alt="Banner 4"/><figcaption>Banner 4 · <a href="assets/options/aireg/aireg-banner-04.png">PNG</a></figcaption></figure>
    <figure><img class="banner" src="assets/options/aireg/aireg-banner-05.png" alt="Banner 5"/><figcaption>Banner 5 · <a href="assets/options/aireg/aireg-banner-05.png">PNG</a></figcaption></figure>
  </div>
</section>
</body>
</html>
